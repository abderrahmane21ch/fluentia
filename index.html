  <script>
    /* Apply the saved theme before first paint to avoid a flash. */
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('fluentia.v1.prefs') || '{}');
        var t = p.theme || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
